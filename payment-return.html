<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paiement — ShopSenegal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260523g" />
  </head>
  <body>
    <main class="container stack-lg card payment-return-main">
      <p id="pr-spinner" class="muted" aria-live="polite">
        Actualisation du statut paiement…
      </p>
      <h1 id="pr-title">Merci pour votre paiement.</h1>
      <p id="pr-message" class="muted">
        Nous vérifions la confirmation envoyée par Paydunya vers notre système…
      </p>
      <dl id="pr-details" class="payment-return-details hidden"></dl>
      <div class="order-actions stack" style="margin-top: 0.75rem">
        <a
          id="pr-whatsapp"
          class="btn-link"
          href="https://wa.me/221773542551?text="
          target="_blank"
          rel="noopener noreferrer"
          >Confirmer sur WhatsApp</a
        >
        <a id="pr-sms" class="btn-link btn-link--ghost" href="sms:+221773542551?body="
          >Envoyer par SMS</a
        >
        <a class="btn-link" href="index.html">← Retour à l’accueil</a>
      </div>
      <p id="pr-hint" class="muted" style="font-size: 0.875rem; margin-top: 1rem"></p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="runtime-env.js?v=20260523g"></script>
    <script src="supabase-config.js?v=20260523g"></script>
    <script src="payment-return.js?v=20260523g"></script>
  </body>
</html>
